# Host Nginx Configuration for INTRAK
# Place this file at: /etc/nginx/sites-available/intrak
# Then create symlink: sudo ln -s /etc/nginx/sites-available/intrak /etc/nginx/sites-enabled/

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name intrak.site www.intrak.site;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name intrak.site www.intrak.site;
    
    # SSL Configuration (adjust paths to your SSL certificates)
    ssl_certificate /etc/letsencrypt/live/intrak.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intrak.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # Frontend (React App)
    location / {
        # Try to proxy to Docker container
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # If proxy fails, serve error page
        proxy_intercept_errors on;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        
        # Custom error pages for this location
        error_page 502 503 504 500 = @error_502;
    }
    
    # Backend API
    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # If proxy fails, serve error page
        proxy_intercept_errors on;
        
        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        
        # Custom error pages for this location
        error_page 502 503 504 500 = @error_502;
    }
    
    # Named location to serve custom error page
    location @error_502 {
        root /var/www/intrak/errors;
        try_files /502.html =502;
        add_header Content-Type text/html;
        internal;
    }
    
    # Serve error pages directly (for testing)
    location = /502.html {
        root /var/www/intrak/errors;
        allow all;
        add_header Content-Type text/html;
    }
}

