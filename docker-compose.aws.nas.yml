services:
  server:
    environment:
      # Keep local uploads path for fallback copy logic.
      - UPLOAD_PATH=/app/uploads
      # Real NAS mount path inside container.
      - NAS_PATH=/mnt/nas/intrak/uploads
      - USE_NAS=true
    volumes:
      # Host NAS is already mounted on EC2 at /mnt/nas (verified via findmnt).
      # Bind it into the server container for true NAS access.
      - type: bind
        source: /mnt/nas
        target: /mnt/nas
        read_only: false
