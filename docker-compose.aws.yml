services:
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Low-memory PostgreSQL tuning for t3.micro (1GB RAM)
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "effective_cache_size=128MB"
      - "-c"
      - "work_mem=4MB"
    deploy:
      resources:
        limits:
          memory: 256M

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - NODE_ENV=production
      - PORT=5000
      - CORS_ORIGIN=${CORS_ORIGIN}
      - CLIENT_URL=${CLIENT_URL}
      # NAS Enabled via Tailscale (RPi NAS)
      - USE_NAS=true
      - UPLOAD_PATH=/app/uploads
      # Email & AI
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - RESEND_FROM_NAME=${RESEND_FROM_NAME}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_MODEL=${AI_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-}
    volumes:
      # NAS mount from host (RPi via Tailscale)
      - /mnt/nas:/mnt/nas
      - /mnt/nas/uploads:/app/uploads
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 384M

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: always
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - server
    deploy:
      resources:
        limits:
          memory: 128M

  # Cloudflare Tunnel for public access
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run --protocol http2
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - client
    # Healthcheck to prevent stale connections
    healthcheck:
      test: [ "CMD", "cloudflared", "tunnel", "info" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  db_data:
  uploads_data:
