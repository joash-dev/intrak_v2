services:
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Low-memory PostgreSQL tuning for t3.micro (1GB RAM)
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "effective_cache_size=128MB"
      - "-c"
      - "work_mem=4MB"
    deploy:
      resources:
        limits:
          memory: 256M

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - NODE_ENV=production
      - PORT=5000
      - CORS_ORIGIN=${CORS_ORIGIN}
      - CLIENT_URL=${CLIENT_URL}
      # NAS Storage (primary) - falls back to local storage if NAS is down
      - USE_NAS=${USE_NAS:-true}
      - NAS_PATH=/app/uploads
      - UPLOAD_PATH=/app/uploads
      - LOCAL_NAS_STAGING_RETENTION_DAYS=${LOCAL_NAS_STAGING_RETENTION_DAYS:-15}
      # Quote cron in .env if it contains spaces, e.g. LOCAL_NAS_STAGING_CLEANUP_CRON="0 3 * * *"
      - LOCAL_NAS_STAGING_CLEANUP_CRON=${LOCAL_NAS_STAGING_CLEANUP_CRON}
      - LOCAL_NAS_STAGING_CLEANUP_ENABLED=${LOCAL_NAS_STAGING_CLEANUP_ENABLED:-true}
      # Email & AI
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - RESEND_FROM_NAME=${RESEND_FROM_NAME}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER}
    volumes:
      # Always use local Docker volume for app uploads path.
      # This keeps EC2 startup independent from host NAS/autofs mount state.
      - uploads_data:/app/uploads
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 384M

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VITE_API_URL=/api
    volumes:
      # Mount SSL certificates from Let's Encrypt
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - server
    deploy:
      resources:
        limits:
          memory: 128M
  # Tunnel disabled - using direct EC2 with Elastic IP + SSL
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   restart: always
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=${TUNNEL_TOKEN}
  #   depends_on:
  #     - client

volumes:
  db_data:
  uploads_data:
