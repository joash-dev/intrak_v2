<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>502 Bad Gateway - INTRAK</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: #f3f6fb;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        @keyframes barUpDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes barDownUp {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(20px); }
        }
        
        .animate-barUpDown {
            animation: barUpDown 2s ease-in-out infinite;
        }
        
        .animate-barDownUp {
            animation: barDownUp 2s ease-in-out infinite;
        }
        
        /* Mobile top bars */
        .mobile-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            z-index: 0;
        }
        
        .mobile-top div {
            width: 33.33%;
            height: 60px;
        }
        
        .mobile-top div:nth-child(1) {
            background: #2563eb;
            animation-delay: 0s;
        }
        
        .mobile-top div:nth-child(2) {
            background: #6366f1;
            animation-delay: 0.2s;
        }
        
        .mobile-top div:nth-child(3) {
            background: #4f46e5;
            animation-delay: 0.4s;
        }
        
        /* Mobile bottom bars */
        .mobile-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            z-index: 0;
        }
        
        .mobile-bottom div {
            width: 33.33%;
            height: 60px;
        }
        
        .mobile-bottom div:nth-child(1) {
            background: #6366f1;
            animation-delay: 0s;
        }
        
        .mobile-bottom div:nth-child(2) {
            background: #4f46e5;
            animation-delay: 0.2s;
        }
        
        .mobile-bottom div:nth-child(3) {
            background: #2563eb;
            animation-delay: 0.4s;
        }
        
        /* Desktop left bars */
        .desktop-left {
            display: none;
        }
        
        /* Desktop right bars */
        .desktop-right {
            display: none;
        }
        
        @media (min-width: 768px) {
            .mobile-top, .mobile-bottom {
                display: none;
            }
            
            .desktop-left, .desktop-right {
                display: block;
                position: absolute;
                z-index: 0;
            }
            
            .desktop-left {
                left: 0;
                top: 0;
            }
            
            .desktop-left div {
                position: absolute;
                width: 60px;
                background: #2563eb;
            }
            
            .desktop-left div:nth-child(1) {
                left: 0;
                height: 80%;
                animation-delay: 0s;
            }
            
            .desktop-left div:nth-child(2) {
                left: 60px;
                height: 100%;
                background: #6366f1;
                animation-delay: 0.2s;
            }
            
            .desktop-left div:nth-child(3) {
                left: 120px;
                height: 60%;
                background: #4f46e5;
                animation-delay: 0.4s;
            }
            
            .desktop-right {
                right: 0;
                bottom: 0;
            }
            
            .desktop-right div {
                position: absolute;
                width: 60px;
                background: #6366f1;
            }
            
            .desktop-right div:nth-child(1) {
                right: 0;
                height: 100%;
                animation-delay: 0s;
            }
            
            .desktop-right div:nth-child(2) {
                right: 60px;
                height: 60%;
                background: #4f46e5;
                animation-delay: 0.2s;
            }
            
            .desktop-right div:nth-child(3) {
                right: 120px;
                height: 80%;
                background: #2563eb;
                animation-delay: 0.4s;
            }
        }
        
        .content {
            text-align: center;
            padding: 2rem;
            z-index: 10;
            position: relative;
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: #111827;
            line-height: 1;
        }
        
        .error-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: #111827;
            text-transform: uppercase;
        }
        
        .error-message {
            color: #374151;
            font-weight: 600;
            margin-bottom: 1.5rem;
            font-size: 1.125rem;
        }
        
        .error-help {
            color: #6b7280;
            margin-bottom: 1.5rem;
        }
        
        .btn-home {
            background: #2563eb;
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: background-color 0.2s;
            font-family: 'Montserrat', sans-serif;
        }
        
        .btn-home:hover {
            background: #1d4ed8;
        }
        
        @media (min-width: 768px) {
            .error-code {
                font-size: 9rem;
            }
            
            .error-title {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>
    <!-- Mobile top bars -->
    <div class="mobile-top">
        <div class="animate-barUpDown"></div>
        <div class="animate-barUpDown"></div>
        <div class="animate-barUpDown"></div>
    </div>
    
    <!-- Mobile bottom bars -->
    <div class="mobile-bottom">
        <div class="animate-barDownUp"></div>
        <div class="animate-barDownUp"></div>
        <div class="animate-barDownUp"></div>
    </div>
    
    <!-- Desktop left bars -->
    <div class="desktop-left">
        <div class="animate-barUpDown"></div>
        <div class="animate-barUpDown"></div>
        <div class="animate-barUpDown"></div>
    </div>
    
    <!-- Desktop right bars -->
    <div class="desktop-right">
        <div class="animate-barDownUp"></div>
        <div class="animate-barDownUp"></div>
        <div class="animate-barDownUp"></div>
    </div>
    
    <!-- Main content -->
    <div class="content">
        <h1 class="error-code">502</h1>
        <h2 class="error-title">Bad Gateway</h2>
        <p class="error-message">The server received an invalid response from an upstream server.</p>
        <p class="error-help">If you need assistance, please contact support.</p>
        <button class="btn-home" onclick="window.location.href='/'">GO HOME</button>
    </div>
</body>
</html>
