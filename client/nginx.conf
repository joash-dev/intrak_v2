# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name intrak.site www.intrak.site;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name intrak.site www.intrak.site;
    root /usr/share/nginx/html;
    index index.html;

    # SSL certificates (mounted from host)
    ssl_certificate /etc/letsencrypt/live/intrak.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intrak.site/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Increase max body size for uploads
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API proxy - MUST be before static assets to handle /api/* requests first
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets in /assets directory only
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Avoid stale HTML shell after deploys (prevents refresh-needed behavior)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Homepage: serve documentation landing at root domain
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /documentation/index.html =404;
    }

    # Normalize docs URL without trailing slash
    location = /documentation {
        return 301 /;
    }

    # Backward-compatible old docs paths -> new public paths
    location ^~ /documentation/manuals/ {
        rewrite ^/documentation/manuals/(.*)$ /manuals/$1 permanent;
    }

    location = /documentation/ {
        return 301 /;
    }

    # Manuals URL at root (public)
    location = /manuals {
        return 301 /manuals/full/;
    }

    location ^~ /manuals/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /documentation$uri /documentation$uri/ =404;
    }

    # Documentation landing source path (kept for direct file serving)
    location ^~ /documentation/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /documentation/index.html;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 =200 /error/404;
    error_page 500 =200 /error/500;
    error_page 502 =200 /error/502;
    error_page 503 =200 /error/503;
    error_page 504 =200 /error/504;
    
    location ~ ^/error/ {
        try_files $uri /index.html;
    }
}
