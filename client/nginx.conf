server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;


    # Increase max body size for uploads
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy
    location /api {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check
    location /health {
        return 404;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages - redirect to React app error handler
    # Return 200 status and serve /error/:code which React Router will handle
    error_page 404 =200 /error/404;
    error_page 500 =200 /error/500;
    error_page 502 =200 /error/502;
    error_page 503 =200 /error/503;
    error_page 504 =200 /error/504;
    
    # Handle error page routes - serve index.html so React Router can handle them
    location ~ ^/error/ {
        try_files $uri /index.html;
    }
}

